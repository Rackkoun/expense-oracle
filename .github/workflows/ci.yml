name: ExpenseOracle CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    build:
        name: Python ${{ matrix.python-version }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ['3.9', '3.10', '3.11']
        steps:
            - name: 📥 Checkout Repository
              uses: actions/checkout@v4
            
            - name: 🐍 Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}
            
            - name: 💾 Cache pip packages
              uses: actions/cache@v4  # Updated to v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
                restore-keys: |
                    ${{ runner.os }}-pip-
            
            - name: 📦 Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install -r requirements-dev.txt
    
            - name: 🎨 Check Formatting (Black)
              run: |
                black --check --diff .

            - name: 📋 Check Imports (isort)
              run: |
                isort --check-only --diff .

            - name: 🔍 Lint with flake8
              run: |
                flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

            - name: 🏷️ Type Check (mypy)
              run: |
                mypy models/ utils/ --ignore-missing-imports

            - name: 🧪 Run Divinations (Tests)
              run: |
                pytest tests/ -v --cov=models --cov=utils --cov-report=xml --cov-report=term

            - name: 📊 Upload Coverage to Codecov
              uses: codecov/codecov-action@v4  # Updated to v4
              with:
                file: ./coverage.xml
                fail_ci_if_error: false
                verbose: true

    security-audit:
        name: 🔒 Security Ward
        runs-on: ubuntu-latest
        steps:
        - name: 📥 Checkout Repository
          uses: actions/checkout@v4
        
        - name: 🐍 Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        
        - name: 📦 Install Dependencies
          run: |
            pip install safety bandit
        
        - name: 🛡️ Safety Check (Dependencies)
          run: |
            pip install -r requirements.txt
            safety check
        
        - name: 🕵️ Bandit Scan (Code Security)
          run: |
            bandit -r models/ utils/ -f json -o bandit-report.json || true
            bandit -r models/ utils/ -f screen
        
        - name: 📤 Upload Security Report
          uses: actions/upload-artifact@v4  # Updated to v4
          if: always()
          with:
            name: security-report-${{ github.sha }}
            path: bandit-report.json